name: llama-cpp
base: core26
version: "b10486"
summary: Snap package for llama.cpp - LLM inference in C/C++
description: |
  llama.cpp packaged as a snap. The main snap ships a CPU build that
  works on any x86_64 or arm64 machine. Optional snap components add
  GPU backends:

    sudo snap install llama-cpp           # CPU
    sudo snap install llama-cpp+hip       # add AMD GPU
    sudo snap install llama-cpp+cuda      # add NVIDIA GPU
    sudo snap install llama-cpp+vulkan    # add Vulkan GPU (Intel, AMD, etc.)
    sudo snap install llama-cpp+opencl    # add OpenCL GPU (Adreno, Mali, etc.)

  Select a backend persistently with:

    sudo snap set llama-cpp backend={cpu,hip,cuda,vulkan,opencl,auto}    # auto = probe
    snap get llama-cpp backend

  or override it per invocation with the env var:

    LLAMA_CPP_BACKEND=cpu llama-cpp cli ...
license: MIT
source-code:
  - https://github.com/talhaHavadar/snap-llama.cpp
  - https://github.com/ggml-org/llama.cpp
issues:
  - https://github.com/talhaHavadar/snap-llama.cpp/issues/new/choose
icon: snap/gui/icon.png
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]
grade: stable
confinement: strict
lint:
  ignore:
    - classic
environment:
  # Used by cli.sh and baked into the snap by snapcraft (expanded at build).
  ARCH_TRIPLET: $CRAFT_ARCH_TRIPLET_BUILD_FOR
  # snapd does not expose a single "components root" env var, so we build it
  # from $SNAP and $SNAP_REVISION. Deriving from $SNAP keeps this portable —
  # on distros like Arch / Fedora the snap mount root is /var/lib/snapd/snap/
  # rather than /snap/, and $SNAP always reflects the real mount path.
  # cli.sh reads $SNAP_COMPONENTS to find backend .so files inside components.
  SNAP_COMPONENTS: $SNAP/../components/$SNAP_REVISION
  LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib:/var/lib/snapd/lib/gl:/var/lib/snapd/lib/gl32:$LD_LIBRARY_PATH
  # llama.cpp's HF downloader writes to $HOME/.cache/huggingface by default,
  # which the `home` interface excludes (top-level dotdirs are blocked). Point
  # it at $SNAP_USER_COMMON so writes land in a path the snap owns.
  HF_HOME: $SNAP_USER_COMMON/huggingface
components:
  hip:
    type: standard
    summary: AMD GPU (HIP/ROCm) backend
    description: |
      Adds libggml-hip.so plus the ROCm runtime libraries so llama.cpp
      can offload to AMD GPUs. Built for the same llama.cpp source tag
      as the parent snap to guarantee ABI compatibility.
  cuda:
    type: standard
    summary: NVIDIA GPU (CUDA) backend
    description: |
      Adds libggml-cuda.so plus the CUDA runtime libraries so llama.cpp
      can offload to NVIDIA GPUs. Built for the same llama.cpp source tag
      as the parent snap to guarantee ABI compatibility.
  vulkan:
    type: standard
    summary: Vulkan GPU backend
    description: |
      Adds libggml-vulkan.so plus the Vulkan runtime libraries so llama.cpp
      can offload to any Vulkan 1.2-capable GPU (Intel Arc, AMD without ROCm,
      mobile GPUs, etc.). Built for the same llama.cpp source tag as the
      parent snap to guarantee ABI compatibility.
  opencl:
    type: standard
    summary: OpenCL GPU backend (Adreno, Mali, and other OpenCL 2.0 GPUs)
    description: |
      Adds libggml-opencl.so plus the OpenCL runtime libraries so llama.cpp
      can offload to OpenCL-capable GPUs (Qualcomm Adreno, ARM Mali, etc.).
      Built for the same llama.cpp source tag as the parent snap to guarantee
      ABI compatibility.
apps:
  llama-cpp:
    command: bin/cli-wrapper
    extensions:
      # Automatically binds host Vulkan/OpenGL maps
      - gpu
    plugs:
      - home
      - network
      - network-bind
      - removable-media
      # CUDA's libggml-cuda.so dlopens libcuda.so.1 (the NVIDIA userspace
      # driver stub) which is NOT redistributable — it must come from the
      # host because it has to match the kernel module version.
      - opengl
      # ROCm/HIP enumerates DRM accel nodes (/dev/accel/accelN) at init,
      # which the `opengl` plug does NOT cover.
      - accel
      # llama.cpp pins worker threads with sched_setaffinity. Without this
      # application fails to init.
      - process-control
parts:
  # --- Wrapper script ------------------------------------------------------
  cli:
    plugin: dump
    source: .
    stage:
      - bin/cli-wrapper
    organize:
      cli.sh: bin/cli-wrapper
  # --- ggml: CPU + loader libs, lives in the main snap --------------------
  # Builds llama.cpp's bundled ggml/ subdirectory standalone with the
  # backend-dl loader enabled and every CPU variant emitted as its own .so.
  #
  # We deliberately do NOT set GGML_BACKEND_DIR. ggml's CMake uses that flag
  # both as the compile-time search path AND as the install DESTINATION,
  # which puts the backend .so files at an absolute path (e.g. /snap/...)
  # under the part install root and breaks the snap layout. Instead we rely
  # on ggml's executable-directory search (ggml-backend-reg.cpp:473): the
  # loader scans `dirname(/proc/self/exe)`. The `organize:` rule below moves
  # the CPU backends into $SNAP/bin/ alongside the llama-* binaries, so
  # exec_dir matches and discovery works without any env var.
  ggml-cpu:
    source: https://github.com/ggml-org/llama.cpp.git
    source-tag: b10486
    source-depth: 1
    source-subdir: ggml
    plugin: cmake
    build-packages:
      - pkg-config
    stage-packages:
      - libgomp1
    # llama.cpp's bundled ggml/ strips standalone-only files (tests/,
    # examples/, ggml.pc.in) but its CMakeLists still auto-enables
    # GGML_STANDALONE when ggml is the top-level project. Force it off so the
    # configure step doesn't try to descend into directories that don't exist.
    override-pull: |
      craftctl default
      sed -i 's/^    set(GGML_STANDALONE ON)/    set(GGML_STANDALONE OFF)/' \
        "${CRAFT_PART_SRC}/ggml/CMakeLists.txt"
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DGGML_BACKEND_DL=ON
      - -DGGML_CPU_ALL_VARIANTS=ON
      - -DGGML_NATIVE=OFF
      - -DGGML_BUILD_TESTS=OFF
      - -DGGML_BUILD_EXAMPLES=OFF
    # Without GGML_BACKEND_DIR, ggml installs the backend modules to
    # CMAKE_INSTALL_BINDIR (= usr/bin/). Move them next to the llama-* binaries
    # in $SNAP/bin/ so the loader's executable-directory scan finds them.
    organize:
      usr/bin/libggml-cpu*.so: bin/
  # --- llama.cpp linked against the ggml-cpu staged tree -------------------
  # LLAMA_USE_SYSTEM_GGML=ON tells llama.cpp to find_package(ggml REQUIRED)
  # against ggml-cpu's install tree (staged before this part runs).
  llama-cpp:
    after: [ggml-cpu]
    source: https://github.com/ggml-org/llama.cpp.git
    source-tag: b10486
    source-depth: 1
    plugin: cmake
    build-packages:
      - libcurl4-openssl-dev
      - pkg-config
    stage-packages:
      - libcurl4t64
      - libssl3t64
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DLLAMA_USE_SYSTEM_GGML=ON
      - -DGGML_NATIVE=OFF
      # Don't ship test binaries and examples in the snap. llama.cpp defaults
      # both to ON when built standalone — without these the prime tree fills
      # with test-* and example-* binaries under usr/bin/.
      - -DLLAMA_BUILD_TESTS=OFF
      - -DLLAMA_BUILD_EXAMPLES=OFF
      # Point find_package(ggml) at the ggml-cpu artefacts staged by the prior
      # part. Snapcraft 8.14's cmake plugin does not pre-set CMAKE_PREFIX_PATH.
      - -DCMAKE_PREFIX_PATH=${CRAFT_STAGE}/usr
    # Move the cli binaries to $SNAP/bin/ so the wrapper finds them on PATH
    # without needing $SNAP/usr/bin. The libs stay at their multi-arch
    # paths — snap-confine + the LD_LIBRARY_PATH set in `environment:`
    # take care of the rest.
    organize:
      usr/bin/llama-*: bin/
  # This part builds a subset of the ROCm/HIP stack from AMD's monorepo, TheRock.
  # Notably, we use a prebuilt version of AMD's LLVM toolchain to avoid blowing
  # up build times (and builder capacity).
  rocm-libs:
    source: https://github.com/ROCm/TheRock.git
    source-tag: therock-7.13
    source-depth: 1
    source-submodules: []
    plugin: nil
    build-packages:
      - automake
      - bison
      - ccache
      - cmake
      - curl
      - flex
      - g++
      - gfortran
      - git
      - git-lfs
      - libegl1-mesa-dev
      - libtool
      - make
      - ninja-build
      - patchelf
      - pkg-config
      - python3-dev
      - python3-venv
      - texinfo
      - xxd
    override-pull: |
      set -e
      craftctl default
      python3 build_tools/fetch_sources.py \
        --no-include-system-projects \
        --no-include-compilers \
        --no-include-debug-tools \
        --no-include-rocm-libraries \
        --no-include-rocm-systems \
        --no-include-ml-frameworks \
        --no-include-media-libs \
        --no-include-iree-libs \
        --no-include-math-libraries \
        --source-sets base rocm-systems rocm-libraries
    override-build: |
      set -e

      # install python deps
      python3 -m venv .venv
      source .venv/bin/activate
      pip install --upgrade pip
      pip install -r requirements.txt

      # fetch prebuilt toolchain (trusted=yes should be fine because of TLS)
      echo 'deb [arch=amd64 trusted=yes] https://repo.amd.com/rocm/packages/ubuntu2604 stable main' \
        | tee /etc/apt/sources.list.d/rocm.list
      apt-get update
      apt-get install -y amdrocm-llvm-dev7.13

      # populate build/compiler/amd-llvm from the deb install, then mark it
      # prebuilt so CMake skips configure/build/stage of amd-llvm
      echo "Substituting AMD deb LLVM into build/compiler/amd-llvm/stage"
      AMD_LLVM_STAGE="$CRAFT_PART_BUILD/build/compiler/amd-llvm/stage"
      mkdir -p "$AMD_LLVM_STAGE/lib/llvm"
      cp -a /opt/rocm/core-7.13/lib/llvm/. "$AMD_LLVM_STAGE/lib/llvm/"
      touch "$CRAFT_PART_BUILD/build/compiler/amd-llvm/stage.prebuilt"

      # ditto for amd-comgr and hipcc
      echo "Substituting AMD deb comgr into build/compiler/amd-comgr/stage"
      COMGR_STAGE="$CRAFT_PART_BUILD/build/compiler/amd-comgr/stage"
      mkdir -p "$COMGR_STAGE/lib" "$COMGR_STAGE/include" "$COMGR_STAGE/lib/cmake"
      cp -a /opt/rocm/core-7.13/lib/libamd_comgr.so* "$COMGR_STAGE/lib/" 2>/dev/null || true
      cp -a /opt/rocm/core-7.13/include/amd_comgr "$COMGR_STAGE/include/"
      cp -a /opt/rocm/core-7.13/lib/cmake/amd_comgr "$COMGR_STAGE/lib/cmake/"
      touch "$CRAFT_PART_BUILD/build/compiler/amd-comgr/stage.prebuilt"
      echo "Substituting AMD deb hipcc into build/compiler/hipcc/stage"
      HIPCC_STAGE="$CRAFT_PART_BUILD/build/compiler/hipcc/stage"
      mkdir -p "$HIPCC_STAGE/bin"
      cp -a /opt/rocm/core-7.13/bin/hipcc* "$HIPCC_STAGE/bin/" 2>/dev/null || true
      cp -a /opt/rocm/core-7.13/bin/hipconfig* "$HIPCC_STAGE/bin/" 2>/dev/null || true
      touch "$CRAFT_PART_BUILD/build/compiler/hipcc/stage.prebuilt"

      # and also for sysdeps, except these will be rebuilt
      echo "Staging rocm_sysdeps alongside lib/llvm"
      mkdir -p "$AMD_LLVM_STAGE/lib/rocm_sysdeps"
      cp -a /opt/rocm/core-7.13/lib/rocm_sysdeps/. "$AMD_LLVM_STAGE/lib/rocm_sysdeps/"

      # then remove system package to make sure it doesn't interfere with the build
      apt-get remove -y amdrocm-llvm-dev7.13
      apt-get autoremove -y

      # avoid breaking builds on newer compilers
      export CFLAGS="${CFLAGS:-} -Wno-error"

      # enable only what ggml's HIP backend needs: core + HIP runtime and BLAS
      cmake --fresh -B build -G Ninja . \
        -DTHEROCK_ENABLE_ALL=OFF \
        -DTHEROCK_ENABLE_CORE_RUNTIME=ON \
        -DTHEROCK_ENABLE_HIP_RUNTIME=ON \
        -DTHEROCK_ENABLE_BLAS=ON \
        -DhipBLASLt_CMAKE_ARGS="-DCMAKE_CXX_FLAGS=-isystem${CRAFT_PART_BUILD}/build/core/clr/dist/include" \
        -DTHEROCK_AMDGPU_FAMILIES='gfx90a;gfx942;gfx1030;gfx110X-all;gfx115X-all;gfx1200;gfx1201' \
        -DTHEROCK_AMDGPU_DIST_BUNDLE_NAME='gfx90a_gfx942_gfx1030_gfx110X-all_gfx115X-all_gfx1200_gfx1201' \
        -DBUILD_TESTING=OFF \
        -DTHEROCK_BUILD_TESTING=OFF \
        -DTHEROCK_BUNDLE_SYSDEPS=ON

      export CMAKE_BUILD_PARALLEL_LEVEL=$CRAFT_PARALLEL_BUILD_COUNT
      cmake --build build --target artifact-blas
      cmake --build build --target dist-rocm

      mkdir -p "$CRAFT_PART_INSTALL/opt/rocm"
      cp -a build/dist/rocm/. "$CRAFT_PART_INSTALL/opt/rocm/"
    prime:
      # staged for the ggml-hip build but kept out of the CPU main snap
      - -opt/rocm
  # --- ggml HIP backend, organised into the `hip` component ----------------
  # Same upstream source-tag as ggml-cpu for ABI compatibility. Only
  # libggml-hip.so + ROCm runtime libs are routed into the component; the
  # local libggml.so / libggml-base.so / ggml-config.cmake this build also
  # produces are filtered at the `stage:` step so they do not collide with
  # ggml-cpu's copies in the default partition.
  ggml-hip:
    after: [rocm-libs]
    source: https://github.com/ggml-org/llama.cpp.git
    source-tag: b10486
    source-depth: 1
    source-subdir: ggml
    plugin: cmake
    build-packages:
      - pkg-config
    # Same standalone-files workaround as ggml-cpu — see comment there.
    override-pull: |
      craftctl default
      sed -i 's/^    set(GGML_STANDALONE ON)/    set(GGML_STANDALONE OFF)/' \
        "${CRAFT_PART_SRC}/ggml/CMakeLists.txt"
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DGGML_BACKEND_DL=ON
      - -DGGML_CPU=OFF
      - -DGGML_HIP=ON
      - -DGGML_NATIVE=OFF
      - -DGGML_BUILD_TESTS=OFF
      - -DGGML_BUILD_EXAMPLES=OFF
      - -DGPU_TARGETS='gfx90a;gfx942;gfx1030;gfx1100;gfx1151;gfx11-generic;gfx1200;gfx1201'
      - -DCMAKE_PREFIX_PATH="${CRAFT_STAGE}/opt/rocm"
    build-environment:
      - ROCM_PATH: "$CRAFT_STAGE/opt/rocm"
      - HIP_PATH: "$ROCM_PATH"
      - HIPCXX: "$ROCM_PATH/lib/llvm/bin/clang++"
      - PATH: "$ROCM_PATH/bin:$ROCM_PATH/lib/llvm/bin:$PATH"
      - LD_LIBRARY_PATH: "$ROCM_PATH/lib:$ROCM_PATH/lib/llvm/lib:$ROCM_PATH/lib/rocm_sysdeps/lib:${LD_LIBRARY_PATH:-}"
    override-build: |
      craftctl default
      mkdir -p "$CRAFT_PART_INSTALL/opt/rocm"
      cp -a "$ROCM_PATH/lib" "$CRAFT_PART_INSTALL/opt/rocm/lib"
    organize:
      # Without GGML_BACKEND_DIR, ggml installs the HIP backend to
      # CMAKE_INSTALL_BINDIR (usr/bin/). Route it into the component.
      usr/bin/libggml-hip.so: (component/hip)/lib/ggml/backends/libggml-hip.so
      # catch-all for ROCm runtime libraries
      opt/rocm: (component/hip)/opt/rocm
    # Drop the ggml-internal artifacts this build also produces. ggml-cpu
    # already owns libggml.so, libggml-base.so, the ggml-config.cmake, the
    # pkgconfig, and the headers — and the hip-built copies differ in content
    # (GGML_HIP=ON bakes into the config), so leaving them would collide.
    stage:
      - -usr/include
      - -usr/lib/*/cmake
      - -usr/lib/*/pkgconfig
      - -usr/lib/*/libggml.so*
      - -usr/lib/*/libggml-base.so*
      - -usr/lib/*/ggml/backends0/libggml-cpu*
      - -opt/rocm/lib/**/include
      - -opt/rocm/lib/**/cmake
      - -opt/rocm/lib/**/pkgconfig
      - -opt/rocm/lib/**/*.a
  # --- ggml CUDA backend, organised into the `cuda` component --------------
  # Same shape as ggml-hip: same upstream source-tag for ABI parity with
  # ggml-cpu, same standalone-files sed, same catch-all organize, same
  # stage exclusions. CUDA-specific flags only. See docs/adr/0006.
  ggml-cuda:
    source: https://github.com/ggml-org/llama.cpp.git
    source-tag: b10486
    source-depth: 1
    source-subdir: ggml
    plugin: cmake
    build-packages:
      - nvidia-cuda-toolkit
      - nvidia-cuda-toolkit-gcc
      - pkg-config
    stage-packages:
      - libcublas12
      - libcudart12
      - libcusparse12
      - libgomp1
    # Same standalone-files workaround as ggml-cpu — see comment there.
    override-pull: |
      craftctl default
      sed -i 's/^    set(GGML_STANDALONE ON)/    set(GGML_STANDALONE OFF)/' \
        "${CRAFT_PART_SRC}/ggml/CMakeLists.txt"
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DGGML_BACKEND_DL=ON
      - -DGGML_CPU=OFF
      - -DGGML_CUDA=ON
      - -DGGML_NATIVE=OFF
      - -DGGML_BUILD_TESTS=OFF
      - -DGGML_BUILD_EXAMPLES=OFF
    organize:
      # Without GGML_BACKEND_DIR, ggml installs the CUDA backend to
      # CMAKE_INSTALL_BINDIR (usr/bin/). Route it into the component.
      usr/bin/libggml-cuda.so: (component/cuda)/lib/ggml/backends/libggml-cuda.so
      # Catch-all for every CUDA runtime library the stage-packages closure
      # pulled in. The `stage:` exclusions below already strip the ggml
      # internals, so anything left in usr/lib/<triplet>/ is part of the
      # NVIDIA GPU runtime and belongs in the component, not the main snap.
      usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/*.so*: (component/cuda)/lib/
    # Drop the ggml-internal artifacts this build also produces — see the
    # equivalent block in ggml-hip for the full rationale.
    stage:
      - -usr/include
      - -usr/lib/*/cmake
      - -usr/lib/*/pkgconfig
      - -usr/lib/*/libggml.so*
      - -usr/lib/*/libggml-base.so*
      - -usr/lib/*/ggml/backends0/libggml-cpu*
  # --- ggml Vulkan backend, organised into the `vulkan` component ----------
  # Same shape as ggml-hip/ggml-cuda: same upstream source-tag for ABI parity
  # with ggml-cpu, same standalone-files sed, same catch-all organize, same
  # stage exclusions. Vulkan-specific flags only.
  # libvulkan1 is the only runtime dep — the Vulkan loader (libvulkan.so.1)
  # itself is vendor-agnostic; the actual GPU ICD (.so) comes from the host
  # via the `opengl` plug (snapd maps /var/lib/snapd/lib/gl into the snap).
  ggml-vulkan:
    source: https://github.com/ggml-org/llama.cpp.git
    source-tag: b10486
    source-depth: 1
    source-subdir: ggml
    plugin: cmake
    build-packages:
      - libvulkan-dev
      - glslc
      - spirv-headers
      - pkg-config
    stage-packages:
      - libvulkan1
    # Same standalone-files workaround as ggml-cpu — see comment there.
    override-pull: |
      craftctl default
      sed -i 's/^    set(GGML_STANDALONE ON)/    set(GGML_STANDALONE OFF)/' \
        "${CRAFT_PART_SRC}/ggml/CMakeLists.txt"
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DGGML_BACKEND_DL=ON
      - -DGGML_CPU=OFF
      - -DGGML_VULKAN=ON
      - -DGGML_NATIVE=OFF
      - -DGGML_BUILD_TESTS=OFF
      - -DGGML_BUILD_EXAMPLES=OFF
    organize:
      # Without GGML_BACKEND_DIR, ggml installs the Vulkan backend to
      # CMAKE_INSTALL_BINDIR (usr/bin/). Route it into the component.
      usr/bin/libggml-vulkan.so: (component/vulkan)/lib/ggml/backends/libggml-vulkan.so
      # Catch-all for every Vulkan runtime library the stage-packages closure
      # pulled in. The `stage:` exclusions below already strip the ggml
      # internals, so anything left in usr/lib/<triplet>/ is part of the
      # Vulkan runtime and belongs in the component, not the main snap.
      usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/*.so*: (component/vulkan)/lib/
    # Drop the ggml-internal artifacts this build also produces — see the
    # equivalent block in ggml-hip for the full rationale.
    stage:
      - -usr/include
      - -usr/lib/*/cmake
      - -usr/lib/*/pkgconfig
      - -usr/lib/*/libggml.so*
      - -usr/lib/*/libggml-base.so*
      - -usr/lib/*/ggml/backends0/libggml-cpu*
  # --- ggml OpenCL backend, organised into the `opencl` component ----------
  # Same shape as ggml-hip/ggml-cuda/ggml-vulkan: same upstream source-tag for
  # ABI parity with ggml-cpu, same standalone-files sed, same catch-all
  # organize, same stage exclusions. OpenCL-specific flags only.
  # ocl-icd-libopencl1 is the OpenCL ICD loader (libOpenCL.so.1); the actual
  # GPU implementation comes from the host via the `opengl` plug (snapd maps
  # /var/lib/snapd/lib/gl into the snap, which includes the OpenCL ICD on
  # supported platforms).
  ggml-opencl:
    source: https://github.com/ggml-org/llama.cpp.git
    source-tag: b10486
    source-depth: 1
    source-subdir: ggml
    plugin: cmake
    build-packages:
      - ocl-icd-opencl-dev
      - opencl-headers
      - pkg-config
    stage-packages:
      - ocl-icd-libopencl1
    # Same standalone-files workaround as ggml-cpu — see comment there.
    override-pull: |
      craftctl default
      sed -i 's/^    set(GGML_STANDALONE ON)/    set(GGML_STANDALONE OFF)/' \
        "${CRAFT_PART_SRC}/ggml/CMakeLists.txt"
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DGGML_BACKEND_DL=ON
      - -DGGML_CPU=OFF
      - -DGGML_OPENCL=ON
      - -DGGML_NATIVE=OFF
      - -DGGML_BUILD_TESTS=OFF
      - -DGGML_BUILD_EXAMPLES=OFF
    organize:
      # Without GGML_BACKEND_DIR, ggml installs the OpenCL backend to
      # CMAKE_INSTALL_BINDIR (usr/bin/). Route it into the component.
      usr/bin/libggml-opencl.so: (component/opencl)/lib/ggml/backends/libggml-opencl.so
      # Catch-all for every OpenCL runtime library the stage-packages closure
      # pulled in. The `stage:` exclusions below already strip the ggml
      # internals, so anything left in usr/lib/<triplet>/ is part of the
      # OpenCL runtime and belongs in the component, not the main snap.
      usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/*.so*: (component/opencl)/lib/
    # Drop the ggml-internal artifacts this build also produces — see the
    # equivalent block in ggml-hip for the full rationale.
    stage:
      - -usr/include
      - -usr/lib/*/cmake
      - -usr/lib/*/pkgconfig
      - -usr/lib/*/libggml.so*
      - -usr/lib/*/libggml-base.so*
