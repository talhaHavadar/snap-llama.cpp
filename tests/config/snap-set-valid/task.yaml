summary: snap set backend=<valid> succeeds and snap get echoes it back.
execute: |-
  set -eux
  exec &> >(tee "${ARTIFACT_LOG}")
  backends="cpu cuda auto"
  # The configure hook only accepts backend=hip on amd64.
  if [ "$(uname -m)" = x86_64 ]; then
    backends="cpu hip cuda auto"
  fi
  for b in $backends; do
    snap set llama-cpp backend="$b"
    got=$(snap get llama-cpp backend)
    echo "set $b -> got $got"
    test "$got" = "$b"
  done
artifacts:
  - .
restore: |
  snap set llama-cpp backend=auto || true
