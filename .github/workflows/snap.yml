name: Snap
on:
  pull_request:
  push:
    branches: [main]
# Cancel superseded runs on the same PR/branch.
concurrency:
  group: snap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build snap
        id: build
        uses: canonical/action-build@v1.3.0
      - name: Upload snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: llama-cpp-${{ matrix.arch }}
          path: |
            ${{ steps.build.outputs.snap }}
            *.comp
          if-no-files-found: error
  publish:
    # Only publish when main advances, never from a PR (PR runs lack secrets).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: llama-cpp-${{ matrix.arch }}
      - name: Install snapcraft
        run: sudo snap install snapcraft --classic
      # `canonical/action-publish` calls plain `snapcraft upload <snap>`, which
      # the store rejects for snaps that declare components ("Missing
      # component(s): hip"). Invoke snapcraft directly so the snap and its
      # component land in the same revision and channel release.
      - name: Publish snap + hip component to latest/edge
        shell: bash
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          snap_files=(llama-cpp_*.snap)
          comp_files=(llama-cpp+hip_*.comp)
          if [ ${#snap_files[@]} -ne 1 ]; then
            echo "expected exactly one .snap file, found: ${snap_files[*]:-<none>}" >&2
            exit 1
          fi
          if [ ${#comp_files[@]} -ne 1 ]; then
            echo "expected exactly one hip .comp file, found: ${comp_files[*]:-<none>}" >&2
            exit 1
          fi
          snapcraft upload "${snap_files[0]}" \
            --component "hip=${comp_files[0]}" \
            --release latest/edge
