name: Snap
on:
  pull_request:
  push:
    branches: [main]
# Cancel superseded runs on the same PR/branch.
concurrency:
  group: snap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: [self-hosted, ubuntu, amd64]
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build snap
        id: build
        uses: canonical/craft-actions/snapcraft/pack@67304fab78ef627dc3f2e72c8a6ad51a493a6070
        with:
          channel: "latest/candidate"
      - name: Collect artifact paths
        id: paths
        # `components` is a space-delimited list; upload-artifact wants one path per line.
        run: |
          {
            echo 'list<<EOF'
            printf '%s\n' '${{ steps.build.outputs.snap }}' ${{ steps.build.outputs.components }}
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Upload snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: llama-cpp-${{ matrix.arch }}
          path: ${{ steps.paths.outputs.list }}
          if-no-files-found: error
  edge-tests:
    if: github.event_name == 'pull_request'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      snap-artifact: llama-cpp-${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      backends: "lxd:"
  publish:
    # Only publish when main advances, never from a PR (PR runs lack secrets).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: llama-cpp-${{ matrix.arch }}
      - name: Install snapcraft
        run: sudo snap install snapcraft --classic
      # `canonical/action-publish` calls plain `snapcraft upload <snap>`, which
      # the store rejects for snaps that declare components ("Missing
      # component(s): <name>"). Invoke snapcraft directly so the snap and
      # every component land in the same revision and channel release.
      # Components are discovered by glob, so adding a new component
      # (vulkan, sycl, …) needs no workflow change — drop a part into
      # snapcraft.yaml and the matching llama-cpp+<name>_*.comp is picked
      # up here automatically.
      - name: Publish snap and components to latest/edge
        shell: bash
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          snap_files=(llama-cpp_*.snap)
          if [ ${#snap_files[@]} -ne 1 ]; then
            echo "expected exactly one .snap file, found: ${snap_files[*]:-<none>}" >&2
            exit 1
          fi
          component_args=()
          for comp in llama-cpp+*.comp; do
            # Extract the component name from llama-cpp+<name>.comp
            name="${comp#llama-cpp+}"
            name="${name%.comp}"
            component_args+=(--component "$name=$comp")
          done
          if [ ${#component_args[@]} -eq 0 ]; then
            echo "no llama-cpp+*.comp files found" >&2
            exit 1
          fi
          snapcraft upload "${snap_files[0]}" \
            "${component_args[@]}" \
            --release latest/edge
