name: Beta Tests
on:
  schedule:
    # 16:00 UTC daily.
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to test (default latest/edge)'
        type: string
        default: 'latest/edge'
      promote:
        description: 'Promote tested revision to latest/beta on success'
        type: boolean
        default: true
jobs:
  # Snapshot the revision currently in $CHANNEL so the promote step at the
  # end targets the SAME revision spread tested, not whatever might have
  # pushed to the channel while spread was running. Also short-circuits the
  # whole pipeline when the source channel already matches latest/beta —
  # there is nothing to promote and no value in re-running spread.
  pre-check:
    runs-on: ubuntu-latest
    env:
      CHANNEL: ${{ inputs.channel || 'latest/edge' }}
    outputs:
      revision: ${{ steps.snapshot.outputs.revision }}
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - id: snapshot
        name: Snapshot channel revision
        run: |
          sudo snap install snapd 2>/dev/null || sudo snap refresh snapd || true
          rev=$(snap info llama-cpp \
                | awk -v ch="$CHANNEL:" '$1==ch {print $4}' \
                | tr -d '()')
          if [ -z "$rev" ]; then
            echo "no revision currently published to $CHANNEL"
            exit 1
          fi
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
          echo "Will test $CHANNEL revision: $rev"
      - id: skip
        name: Decide whether to skip
        run: |
          beta=$(snap info llama-cpp \
                 | awk '$1=="latest/beta:" {print $4}' \
                 | tr -d '()')
          if [ "$beta" = "${{ steps.snapshot.outputs.revision }}" ]; then
            echo "Channel revision matches latest/beta — nothing to test"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
  test:
    needs: pre-check
    if: needs.pre-check.outputs.skip != 'true'
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      channel: ${{ inputs.channel || 'latest/edge' }}
  # Schedule events always promote on success; workflow_dispatch lets the
  # user opt out via the `promote` input. `needs: test` implicitly requires
  # spread to have passed (skipped/failed test jobs skip promote too).
  promote:
    needs: [pre-check, test]
    if: |
      needs.pre-check.outputs.skip != 'true' &&
      (github.event_name == 'schedule' || inputs.promote)
    runs-on: ubuntu-latest
    steps:
      - name: Promote tested revision to latest/beta
        run: |
          sudo snap install snapcraft --classic
          snapcraft release llama-cpp ${{ needs.pre-check.outputs.revision }} latest/beta
          echo "Promoted revision ${{ needs.pre-check.outputs.revision }} → latest/beta"
          # Log the post-promote channel map so a human reviewing the run
          # can confirm components rode along.
          snap info llama-cpp | sed -n '/channels:/,/^$/p'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
